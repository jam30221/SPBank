{% extends "base.html" %}
{% block content %}
<!-- Top header for quick navigation (hamburger + drawer) -->
<header class="login-header">
  <button class="hamburger" aria-label="Open menu" aria-controls="sideMenu" aria-expanded="false">
    <span class="hamburger-box">
      <span class="hamburger-inner"></span>
    </span>
  </button>
  <div class="welcome-text">Support</div>
  <nav id="sideMenu" class="nav-drawer" aria-hidden="true">
    <div class="sidebar-title">Menu</div>
    <a class="side-link" href="{{ url_for('index') }}">Home</a>
    <a class="side-link" href="{{ url_for('about') }}">About</a>
    <a class="side-link" href="{{ url_for('login_view') }}">Login</a>
    <a class="side-link" href="{{ url_for('signup') }}">Register</a>
    <a class="side-link" href="{{ url_for('support') }}">Support</a>
  </nav>
</header>

<section class="support-form">
  <h2>Submit a Complaint</h2>
  <form method="post" action="/support">
    <label>First Name</label>
    <input type="text" name="first_name" required>

    <label>Last Name</label>
    <input type="text" name="last_name" required>

    <label>Contact Email</label>
    <input type="email" name="email" required>

    <label>Contact Phone</label>
    <input type="tel" name="phone">

    <label>Complaint ID</label>
    <input type="text" name="complaint_id" required>

    <label>Your Complaint</label>
    <textarea name="complaint_text" rows="5" required></textarea>

    <button type="submit">Submit</button>
  </form>
</section>
{% endblock %}
