{% extends "base.html" %}
{% block content %}
<section class="form-container">
  <div class="form-card">
    <h2>{{ title }}</h2>
    <form method="post">
      <label for="email">Enter your account email</label>
      <input type="email" id="email" name="email" required>
      <button type="submit" class="btn primary">Submit</button>
    </form>
  </div>
</section>
{% endblock %}
