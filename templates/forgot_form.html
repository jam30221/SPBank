{% extends "base.html" %}
{% block content %}
<section class="signup-container">
  <div class="signup-card">
    <h3>{{ title }}</h3>
    <p>Please enter the email address associated with your account. We'll send instructions to that address.</p>
    <form method="post">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <button type="submit" class="btn primary">Submit</button>
    </form>
    <p style="margin-top:12px;font-size:0.9rem;color:#556;">If you don't see an email, check your spam folder or contact support.</p>
  </div>
</section>
{% endblock %}
