{% extends "base.html" %}
{% block content %}

<section class="transfer-form">
  <h2>Make a Transfer</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('transfers') }}">
    <div class="form-group">
      <label for="first_name">Recipient First Name</label>
      <input type="text" id="first_name" name="first_name" required>
    </div>

    <div class="form-group">
      <label for="middle_name">Recipient Middle Name</label>
      <input type="text" id="middle_name" name="middle_name">
    </div>

    <div class="form-group">
      <label for="last_name">Recipient Last Name</label>
      <input type="text" id="last_name" name="last_name" required>
    </div>

    <div class="form-group">
      <label for="bank_name">Bank Name</label>
      <input type="text" id="bank_name" name="bank_name" required>
    </div>

    <div class="form-group">
      <label for="account_number">Account Number</label>
      <input type="text" id="account_number" name="account_number" required>
    </div>

    <div class="form-group">
      <label for="routing_number">Routing Number</label>
      <input type="text" id="routing_number" name="routing_number" required>
    </div>

    <div class="form-group">
      <label for="bank_address">Bank Address</label>
      <input type="text" id="bank_address" name="bank_address" required>
    </div>

    <div class="form-group">
      <label for="recipient_number">Recipient Phone Number</label>
      <input type="tel" id="recipient_number" name="recipient_number" required>
    </div>

    <div class="form-group">
      <label for="amount">Amount (USD)</label>
      <input type="number" id="amount" name="amount" step="0.01" required>
    </div>

    <div class="form-group">
      <label for="login_pin">Login PIN</label>
      <input type="password" id="login_pin" name="login_pin" required>
    </div>

    <button type="submit" class="btn-primary">Submit Transfer</button>
  </form>
</section>

{% endblock %}
