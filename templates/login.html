{% extends "base.html" %}
{% block content %}

<style>
  /* Full-page background */
  body {
    background: url("{{ url_for('static', filename='login-bg2.avif') }}") no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
</style>

<!-- Top contact bar -->
<div class="topbar">
  <div class="left">
  </div>
</div>

<!-- Login page header -->
<header class="login-header">
  <!-- Hamburger button (uses global JS/CSS) -->
  <button class="hamburger" aria-label="Open menu" aria-controls="sideMenu" aria-expanded="false">
    <span class="hamburger-box">
      <span class="hamburger-inner"></span>
    </span>
  </button>

  <!-- Centered welcome text -->
  <h3 class="welcome-text">Welcome! Login Now</h3>

  <!-- Hidden nav menu (slides out when hamburger clicked) -->
  <nav id="sideMenu" class="nav-drawer" aria-hidden="true">
    <div class="sidebar-title">Menu</div>
    <a class="side-link" href="/">Home</a>
    <a class="side-link" href="/about">About</a>
    <a class="side-link" href="/login">Login</a>
    <a class="side-link" href="/signup">Register</a>
    <a class="side-link" href="/support">Support</a>
  </nav>
</header>


<!-- Login form -->
<section class="login-container">
  <div class="login-card">

    {% if error_message %}
      <p class="error-msg">{{ error_message }}</p>
    {% endif %}

  
     <!-- ✅ Proper form wrapper -->
    <form action="{{ url_for('login_view') }}" method="POST">

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
      </div>

      <div class="mb-3">
        <label for="pin" class="form-label">Security PIN</label>
        <input type="password" class="form-control" id="pin" name="pin" placeholder="Enter PIN" required>
      </div>

      <div class="d-flex justify-content-center mb-2">
        <label for="showPassword" class="me-2 mb-0">Show Password</label>
        <input type="checkbox" id="showPassword">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <label for="showPin" class="mb-0">Show PIN</label>
        <input type="checkbox" id="showPin">
      </div>

      <div class="assist-links">
        <a href="{{ url_for('forgot_username_view') }}">Forgot Username?</a>
        <a href="{{ url_for('forgot_password_view') }}">Forgot Password?</a>
        <a href="{{ url_for('reset_pin_view') }}">Reset PIN</a>
      </div>

      <div class="verify-human">
        <input type="checkbox" id="human" required>
        <label for="human">Verify you are a human</label>
      </div>

      <button type="submit" class="btn-primary w-100">Login</button>
    </form>
    <!-- ✅ Closing form is now in the right place -->

  </div>
</section>

{% endblock %}
