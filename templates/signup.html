{% extends "base.html" %}
{% block content %}
<!-- Top header for quick navigation (hamburger + drawer) -->
<header class="login-header">
  <button class="hamburger" aria-label="Open menu" aria-controls="sideMenu" aria-expanded="false">
    <span class="hamburger-box">
      <span class="hamburger-inner"></span>
    </span>
  </button>
  <div class="welcome-text">Registeration</div>
  <nav id="sideMenu" class="nav-drawer" aria-hidden="true">
    <div class="sidebar-title">Menu</div>
    <a class="side-link" href="{{ url_for('index') }}">Home</a>
    <a class="side-link" href="{{ url_for('about') }}">About</a>
    <a class="side-link" href="{{ url_for('login_view') }}">Login</a>
    <a class="side-link" href="{{ url_for('signup') }}">Register</a>
    <a class="side-link" href="{{ url_for('support') }}">Support</a>
  </nav>
</header>

<section class="signup-container">
  <div class="signup-card">
    <!-- Progress bar -->
    <div class="progressbar">
      <div class="step active">1</div>
      <div class="line"></div>
      <div class="step">2</div>
      <div class="line"></div>
      <div class="step">3</div>
    </div>
    <p class="progress-labels">
      <span>Fill Form</span>
      <span>Review</span>
      <span>Submitted</span>
    </p>

    <h3>Create Account With Us!</h3>
    <form method="post" action="/signup">
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" required>

      <label for="mname">Middle Name (M)</label>
      <input type="text" id="mname" name="mname">

      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" required>

      <label for="address">Current Address</label>
      <input type="text" id="address" name="address" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="ssn">SSN</label>
      <input type="text" id="ssn" name="ssn" required>

      <label for="dl">DL Number</label>
      <input type="text" id="dl" name="dl" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Choose Password</label>
      <input type="password" id="password" name="password" required>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>

      <button type="submit" class="btn primary">Submit Application</button>
    </form>
  </div>
</section>
{% endblock %}
